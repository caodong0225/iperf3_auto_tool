name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0, v1.1, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn clean package -DskipTests
      
    - name: Extract version from tag
      id: tag_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
    - name: Generate release notes
      id: release_notes
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        {
          echo "# Auto iPerf3 - Release $TAG"
          echo ""
          echo "## 📦 Installation"
          echo ""
          echo "Download the JAR file below and run with:"
          echo "\`\`\`bash"
          echo "java -jar auto-iperf3-*-shaded.jar"
          echo "\`\`\`"
          echo ""
          echo "**Requirements:**"
          echo "- Java 17 or higher"
          echo "- iperf3 installed on remote hosts"
          echo ""
          echo "## 🚀 What's New"
          echo ""
        } > release_notes.md
        
        if [ -z "$PREV_TAG" ]; then
          # First release - show all commits grouped by type
          echo "### Initial Release" >> release_notes.md
          echo "" >> release_notes.md
          
          # Features
          FEATURES=$(git log --pretty=format:"- %s (\`%h\`)" --grep="^feat" --reverse 2>/dev/null)
          if [ -n "$FEATURES" ]; then
            echo "#### ✨ Features" >> release_notes.md
            echo "$FEATURES" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          # Fixes
          FIXES=$(git log --pretty=format:"- %s (\`%h\`)" --grep="^fix" --reverse 2>/dev/null)
          if [ -n "$FIXES" ]; then
            echo "#### 🐛 Bug Fixes" >> release_notes.md
            echo "$FIXES" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          # Other changes
          OTHERS=$(git log --pretty=format:"- %s (\`%h\`)" --grep="^refactor\|^chore\|^perf\|^style\|^docs" --reverse 2>/dev/null)
          if [ -n "$OTHERS" ]; then
            echo "#### 🔧 Improvements" >> release_notes.md
            echo "$OTHERS" >> release_notes.md
            echo "" >> release_notes.md
          fi
        else
          # Subsequent releases - categorize commits
          echo "### ✨ Major Features" >> release_notes.md
          echo "" >> release_notes.md
          FEATURES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (\`%h\`)" --grep="^feat" --reverse 2>/dev/null)
          if [ -n "$FEATURES" ]; then
            echo "$FEATURES" >> release_notes.md
          else
            echo "- No major features in this release" >> release_notes.md
          fi
          
          echo "" >> release_notes.md
          echo "### 🐛 Bug Fixes" >> release_notes.md
          echo "" >> release_notes.md
          FIXES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (\`%h\`)" --grep="^fix" --reverse 2>/dev/null)
          if [ -n "$FIXES" ]; then
            echo "$FIXES" >> release_notes.md
          else
            echo "- No bug fixes in this release" >> release_notes.md
          fi
          
          echo "" >> release_notes.md
          echo "### 🔧 Improvements" >> release_notes.md
          echo "" >> release_notes.md
          OTHERS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (\`%h\`)" --grep="^refactor\|^chore\|^perf\|^style\|^docs" --reverse 2>/dev/null)
          if [ -n "$OTHERS" ]; then
            echo "$OTHERS" >> release_notes.md
          else
            echo "- No improvements in this release" >> release_notes.md
          fi
        fi
        
        {
          echo ""
          echo "## 📋 Full Changelog"
          echo ""
          if [ -z "$PREV_TAG" ]; then
            echo "See [full commit history](https://github.com/${{ github.repository }}/commits/${TAG})"
          else
            echo "See [full commit history](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG})"
          fi
          echo ""
          echo "---"
          echo ""
          echo "*Generated automatically by GitHub Actions*"
        } >> release_notes.md
        
        echo "NOTES_PATH=release_notes.md" >> $GITHUB_OUTPUT
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          target/auto-iperf3-*-shaded.jar
        body_path: release_notes.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
